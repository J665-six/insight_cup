Global:
  checkpoints: null
  pretrained_model: null
  output_dir: ./training/knife/output/pplcnetv2_base_knife10
  device: gpu
  seed: 20260924
  save_interval: 5
  eval_during_train: true
  eval_interval: 1
  epochs: 35
  print_batch_step: 10
  use_visualdl: false
  image_shape: [3, 224, 224]
  save_inference_dir: ./models/knife/pplcnetv2_base_knife10/paddle_inference

AMP:
  use_amp: false
  use_fp16_test: false
  scale_loss: 128.0
  use_dynamic_loss_scaling: true
  use_promote: false
  level: O1

Arch:
  name: PPLCNetV2_base
  class_num: 10
  pretrained: true
  use_ssld: true

Loss:
  Train:
    - CELoss:
        weight: 1.0
        epsilon: 0.1
  Eval:
    - CELoss:
        weight: 1.0

Optimizer:
  name: Momentum
  momentum: 0.9
  lr:
    name: Cosine
    learning_rate: 0.005
    warmup_epoch: 2
  regularizer:
    name: L2
    coeff: 0.00004

DataLoader:
  Train:
    dataset:
      name: ImageNetDataset
      image_root: ./data/knife_dataset/trainv5_grouped
      cls_label_path: ./data/knife_dataset/trainv5_grouped/train_list.txt
      transform_ops:
        - DecodeImage:
            to_rgb: true
            channel_first: false
        - ResizeImage:
            size: [224, 224]
        - RandFlipImage:
            flip_code: 1
        - ColorJitter:
            prob: 0.8
            brightness: 0.2
            contrast: 0.2
            saturation: 0.2
            hue: 0.05
        - NormalizeImage:
            scale: 1.0/255.0
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
            order: ""
    sampler:
      name: DistributedBatchSampler
      batch_size: 64
      drop_last: false
      shuffle: true
    loader:
      num_workers: 4
      use_shared_memory: true

  Eval:
    dataset:
      name: ImageNetDataset
      image_root: ./data/knife_dataset/trainv5_grouped
      cls_label_path: ./data/knife_dataset/trainv5_grouped/val_list.txt
      transform_ops:
        - DecodeImage:
            to_rgb: true
            channel_first: false
        - ResizeImage:
            size: [224, 224]
        - NormalizeImage:
            scale: 1.0/255.0
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
            order: ""
    sampler:
      name: DistributedBatchSampler
      batch_size: 128
      drop_last: false
      shuffle: false
    loader:
      num_workers: 4
      use_shared_memory: true

Infer:
  infer_imgs: ./data/knife_dataset/trainv5_grouped/images/test
  batch_size: 32
  transforms:
    - DecodeImage:
        to_rgb: true
        channel_first: false
    - ResizeImage:
        size: [224, 224]
    - NormalizeImage:
        scale: 1.0/255.0
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
        order: ""
    - ToCHWImage:
  PostProcess:
    name: Topk
    topk: 2
    class_id_map_file: ./data/knife_dataset/trainv5_grouped/labels.txt

Metric:
  Train:
    - TopkAcc:
        topk: [1, 5]
  Eval:
    - TopkAcc:
        topk: [1, 5]
