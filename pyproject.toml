[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-cup"
version = "0.1.0"
description = "YOLO major-class routing with InsightFace and PaddleClas recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8",
  "onnx>=1.14",
  "onnxruntime>=1.15",
  "Pillow>=9",
  "faiss-cpu>=1.12,<2",
  "pyrealsense2>=2.55",
  "PyYAML>=6",
  "requests>=2.28",
  "scikit-image>=0.19",
  "tqdm>=4.64",
  "ultralytics>=8.3",
]

[project.scripts]
insight-cup = "insight_cup.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["insight_cup*"]

[tool.setuptools.package-data]
"insight_cup.app" = ["ui/*.html", "ui/*.css", "ui/*.js"]
"insight_cup.vendor.insightface_core" = ["LICENSE", "UPSTREAM.md", "SOURCE_MANIFEST.json"]
"insight_cup.vendor.paddleclas_core" = ["LICENSE", "UPSTREAM.md", "SOURCE_MANIFEST.json"]
